    menuEl.style.visibility = '';
    void menuEl.offsetWidth;
    menuArrow.style.left = (r.left + r.width / 2) + 'px'; menuArrow.style.bottom = (window.innerHeight - nr.top + 7) + 'px';
    menuEl.classList.add('show'); menuArrow.classList.add('show'); menuBg.classList.add('show');
    menuOpen = true;
    try { if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium'); else if(navigator.vibrate) navigator.vibrate(12); } catch(e) {}
  }
  function closeMenu(){
    if(!menuOpen) return;
    menuOpen = false;
    if(menuBtn){ menuBtn.classList.remove('mopen'); menuBtn = null; }
    nav.classList.remove('menuing');
    menuEl.classList.remove('show'); menuArrow.classList.remove('show'); menuBg.classList.remove('show');
  }
  function runItem(k){
    var it = menuActs[k];
    closeMenu();
    if(it && it.f) setTimeout(it.f, 30);
  }
  function hlAt(x, y){
    var el = document.elementFromPoint(x, y), hit = el && el.closest ? el.closest('.hsm-it') : null;
    Array.prototype.forEach.call(menuEl.querySelectorAll('.hsm-it'), function(b){
      var on = b === hit;
      if(on && !b.classList.contains('hl')){ try { if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.selectionChanged(); } catch(e) {} }
      b.classList.toggle('hl', on);
    });
    return hit;
  }

  var press = null;
  document.addEventListener('contextmenu', function(e){
    var t = e.target;
    if(t && t.closest && (t.closest('#hsnav') || t.closest('#hsMenu') || t.closest('.hs-av'))) e.preventDefault();
  }, true);
  nav.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    closeMenu();
    press = {b:b, x:e.clientX, y:e.clientY, long:false, id:e.pointerId};
    press.timer = setTimeout(function(){
      if(!press) return;
      press.long = true;
      b.classList.add('hold');
      openMenu(b);
    }, 420);
  });
  document.addEventListener('pointermove', function(e){
    if(!press) return;
    if(!press.long){
      if(Math.abs(e.clientX - press.x) > 12 || Math.abs(e.clientY - press.y) > 12){ clearTimeout(press.timer); press = null; }
      return;
    }
    hlAt(e.clientX, e.clientY);
  });
  function endPress(e, cancel){
    if(!press) return;
    var p = press; press = null;
    clearTimeout(p.timer);
    p.b.classList.remove('hold');
    if(!p.long) return;
    blockClickUntil = Date.now() + 500;
    if(cancel) return closeMenu();
    var hit = hlAt(e.clientX, e.clientY);
    if(hit) runItem(parseInt(hit.getAttribute('data-k'), 10));
    else Array.prototype.forEach.call(menuEl.querySelectorAll('.hl'), function(b){ b.classList.remove('hl'); });
  }
  document.addEventListener('pointerup', function(e){ endPress(e, false); });
  document.addEventListener('pointercancel', function(e){ endPress(e, true); });
  document.addEventListener('click', function(e){
    if(Date.now() < blockClickUntil && nav.contains(e.target)){ e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
  menuEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.hsm-it') : null;
    if(b) runItem(parseInt(b.getAttribute('data-k'), 10));
  });
  menuBg.addEventListener('click', closeMenu);
  menuBg.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeMenu(); });

  try {
    if(!localStorage.getItem('hs_menuHint')){
      localStorage.setItem('hs_menuHint', '1');
      setTimeout(function(){ toast(T.m_hold); }, 1800);
    }
  } catch(e) {}

  renderList();
})();
</script>
